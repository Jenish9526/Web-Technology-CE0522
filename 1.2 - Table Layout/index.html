<html>
  <head>
    <title>Table Layout Website</title>
  </head>
  <body>
    <table border="1" width="100%" cellpadding="10" cellspacing="0">
      <tr>
        <td width="20%" align="center">
          <img
            src="indus.png"
            alt="Indus University Logo"
            width="150"
            height="auto"
          />
        </td>
        <td width="60%" align="center">
          <b>WEBSITE NAME</b>
        </td>
        <td width="20%" align="center">
          Search: <input type="text" name="search" />
          <input type="submit" value="Go" />
        </td>
      </tr>
      <tr>
        <td colspan="3" align="center">
          <table border="1" cellpadding="8" cellspacing="0" align="center">
            <tr>
              <td><a href="#">Home</a></td>
              <td><a href="#">About</a></td>
              <td><a href="#">Services</a></td>
              <td><a href="#">Contact</a></td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td width="20%" valign="top">
          <b>News</b><br />
          News item 1<br />
          News item 2<br />
          News item 3
        </td>
        <td width="60%" valign="top">
          <b>Content Area</b><br /><br />
          This is the main content area of the webpage. You can put articles,
          text, images, and other information here.
        </td>
        <td width="20%" valign="top">
          <b>Events</b><br />
          Event 1<br />
          Event 2<br />
          Event 3
        </td>
      </tr>
      <tr>
        <td colspan="3" align="center"></td>
      </tr>
    </table>
  </body>
</html>
