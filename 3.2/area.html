<!DOCTYPE html>
<html>
<head>
    <title>Area Calculator</title>

    <style>
        .box {
            border: 2px solid black;
            width: 300px;
            padding: 20px;
            margin: 20px;
        }

        label {
            display: inline-block;
            width: 70px;
        }
    </style>
</head>

<body>

    <h2>Area Calculator</h2>

    <div class="box">
        <h3>Triangle</h3>

        <label>Base:</label>
        <input type="number" id="base"><br><br>

        <label>Height:</label>
        <input type="number" id="height"><br><br>

        <button onclick="triangleArea()">Calculate</button>

        <p id="triangleResult"></p>
    </div>

    <div class="box">
        <h3>Rectangle</h3>

        <label>Length:</label>
        <input type="number" id="length"><br><br>

        <label>Width:</label>
        <input type="number" id="width"><br><br>

        <button onclick="rectangleArea()">Calculate</button>

        <p id="rectangleResult"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
